stages:
  - install
  - test
  - build
  - package
  - deploy


# ─── CACHE npm pour éviter de retélécharger les dépendances ───────────────────
default:
  tags:
    - projeet
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - node_modules/


# ─── STAGE 1 : Installation des dépendances ───────────────────────────────────
install-deps:
  stage: install
  image: node:18
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour


# ─── STAGE 2 : Tests + rapport HTML ───────────────────────────────────────────
run-tests:
  stage: test
  image: node:18
  dependencies:
    - install-deps
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 make g++
  script:
    - npm test
  artifacts:
    name: "rapport-tests-$CI_COMMIT_SHORT_SHA"
    paths:
      - tests/report/index.html
    expire_in: 7 days
    when: always


# ─── STAGE 3 : Build de l'image Docker ────────────────────────────────────────
build-docker:
  stage: build
  image: docker:24
  services:
    - name: docker:24-dind
      command: ["--tls=false"]
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
    IMAGE_TAG: "appli-reservation:$CI_COMMIT_SHORT_SHA"
  script:
    - docker build -t $IMAGE_TAG .
  needs:
    - run-tests


# ─── STAGE 4 : Export de l'image comme artefact ───────────────────────────────
export-image:
  stage: package
  image: docker:24
  services:
    - name: docker:24-dind
      command: ["--tls=false"]
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
    IMAGE_TAG: "appli-reservation:$CI_COMMIT_SHORT_SHA"
  script:
    - docker build -t $IMAGE_TAG .
    - docker save $IMAGE_TAG | gzip > appli-reservation.tar.gz
  artifacts:
    name: "image-docker-$CI_COMMIT_SHORT_SHA"
    paths:
      - appli-reservation.tar.gz
    expire_in: 3 days
  needs:
    - run-tests


# ─── STAGE 5 : Déploiement automatique sur la VM ─────────────────────────────
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - chmod 400 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - |
      ssh $SSH_USER@$SSH_HOST "
        cd /root &&
        curl -L \
          --header 'PRIVATE-TOKEN: glpat-rp66vxTE1hb77qCq0tW__G86MQp1OjEH.01.0w05tf9g4' \
          'http://100.119.96.20:8929/api/v4/projects/1/jobs/artifacts/main/download?job=export-image' \
          -o artifacts.zip &&
        unzip -o artifacts.zip &&
        gunzip -c appli-reservation.tar.gz | docker load &&
        docker stop appli-reservation || true &&
        docker rm appli-reservation || true &&
        docker run -d \
          --name appli-reservation \
          -p 3000:3000 \
          -e JWT_SECRET=$JWT_SECRET \
          --restart unless-stopped \
          appli-reservation:$CI_COMMIT_SHORT_SHA
      "
  needs:
    - export-image
  only:
    - main